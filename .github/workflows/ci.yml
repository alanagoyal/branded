name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-time placeholders only. PR code receives no provider credentials.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      BRAINTRUST_API_KEY: ci-placeholder
      ONEDOC_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_ENDPOINT_SECRET: whsec_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check fresh application schema
        run: |
          npm install --prefix "$RUNNER_TEMP/branded-sql" --no-package-lock --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/branded-sql/node_modules" node scripts/test-schema-sql.cjs
      - run: npm run build
