<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Branded is being sunset. For a similar service, we recommend using ChatGPT.">
  <meta name="theme-color" content="#faf8fb">
  <title>Branded — Sunset announcement</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #201727; background: #faf8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header { padding: 32px clamp(24px, 6vw, 80px); }
    .wordmark { font-size: 25px; font-weight: 750; letter-spacing: -1px; }
    main { flex: 1; display: grid; place-items: center; padding: 40px 24px 100px; }
    .announcement { width: 100%; max-width: 720px; text-align: center; }
    .eyebrow { display: inline-block; margin: 0 0 28px; padding: 8px 13px; border: 1px solid #e5d7ea; border-radius: 999px; color: #764883; background: #f3eaf6; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(44px, 7vw, 76px); font-weight: 750; letter-spacing: -.055em; line-height: 1.08; text-wrap: balance; }
    h1 span { color: #9952a5; }
    .description { max-width: 460px; margin: 28px auto 32px; color: #655c6b; font-size: clamp(18px, 2.5vw, 21px); line-height: 1.65; text-wrap: pretty; }
    .cta { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 14px 23px; border-radius: 9px; background: #221729; color: white; font-size: 16px; font-weight: 650; text-decoration: none; }
    .cta:hover { background: #49304f; }
    .cta:focus-visible { outline: 3px solid #9952a5; outline-offset: 5px; }
    footer { padding: 24px; text-align: center; color: #7b7181; font-size: 14px; }
    @media (max-width: 480px) { header { padding-top: 24px; } main { padding-top: 40px; padding-bottom: 64px; } h1 { max-width: 340px; margin-inline: auto; } }
  </style>
</head>
<body>
  <header><div class="wordmark">Branded</div></header>
  <main>
    <section class="announcement" aria-labelledby="announcement-title">
      <p class="eyebrow">Sunset announcement</p>
      <h1 id="announcement-title">Branded is<br>being <span>sunset.</span></h1>
      <p class="description">For a similar service, we recommend using ChatGPT.</p>
      <a class="cta" href="https://chatgpt.com">Visit ChatGPT <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <footer>Thank you for being part of Branded.</footer>
</body>
</html>
